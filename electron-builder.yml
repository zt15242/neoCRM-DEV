appId: com.neocrm.developer.desktop
productName: NeoCRM Desktop
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
asarUnpack:
  - node_modules/esbuild/**
  - node_modules/@esbuild/**
  # esbuild runs as a child process and cannot read packages inside app.asar.
  - node_modules/react/**
  - node_modules/react-dom/**
  - node_modules/scheduler/**
  - node_modules/lucide-react/**
publish:
  provider: github
  owner: zt15242
  repo: neoCRM-DEV
mac:
  identity: null
  gatekeeperAssess: false
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
