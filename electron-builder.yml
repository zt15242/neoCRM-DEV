appId: com.neocrm.developer.desktop
productName: NeoCRM Desktop
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
publish:
  provider: github
  owner: zt15242
  repo: neoCRM-DEV
mac:
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: "J.A.R.V.I.S. 贾维斯总领管家需要访问您的麦克风以进行语音指令与实时对讲"
  gatekeeperAssess: false
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
