appId: com.neocrm.developer.desktop
productName: NeoCRM Desktop
beforePack: scripts/ffmpeg-before-pack.cjs
afterPack: scripts/ffmpeg-after-pack.cjs
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
asarUnpack:
  - node_modules/esbuild/**
  - node_modules/@esbuild/**
  # esbuild runs as a child process and cannot read packages inside app.asar.
  - node_modules/react/**
  - node_modules/react-dom/**
  - node_modules/scheduler/**
  - node_modules/lucide-react/**
publish:
  provider: github
  owner: zt15242
  repo: neoCRM-DEV
mac:
  extraResources:
    - from: resources/ffmpeg/darwin-${arch}
      to: bin/ffmpeg
      filter: [ffmpeg, ffmpeg.LICENSE, ffmpeg.README, SOURCE.json]
  identity: null
  gatekeeperAssess: false
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: NeoCRM 需要使用麦克风来录制会议并进行实时转写。
    NSAudioCaptureUsageDescription: NeoCRM 需要捕获设备播放声音来合并录制会议音频。
    NSScreenCaptureUsageDescription: NeoCRM 需要捕获设备播放声音来合并录制会议音频。
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
win:
  extraResources:
    - from: resources/ffmpeg/win32-${arch}
      to: bin/ffmpeg
      filter: [ffmpeg.exe, ffmpeg.LICENSE, ffmpeg.README, SOURCE.json]
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
